name: ci

# 测试；main 分支的每次提交都把 proxy-gateway 发布到滚动的预发布 `edge`（程序和 ghcr.io 镜像），打 v* tag 时发布正式版本。
# 程序同时是部署工具和网关（Caddy + proxy_gateway 模块），Caddy 及依赖版本由 go.mod 固定。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/proxy-gateway-linux-$arch ./cmd/proxy-gateway
          done
          mods=$(dist/proxy-gateway-linux-amd64 list-modules)
          for m in proxy_gateway admin.api.proxy_gateway dns.providers.cloudflare; do
            grep -qx "$m" <<<"$mods" || { echo "missing $m"; exit 1; }
          done
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          # 先让 edge 标签指向本次提交，再更新滚动的预发布
          git tag -f edge && git push -f origin refs/tags/edge
          notes="main 分支 ${GITHUB_SHA::7} 的构建，每次提交自动更新。"
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --notes "$notes" --prerelease --latest=false
            gh release upload edge dist/* --clobber
          else
            gh release create edge dist/* --title "edge" --notes "$notes" --prerelease --latest=false
          fi

  # 容器镜像：main 分支推送 edge 标签，v* tag 推送同名标签和 latest
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=$image:$GITHUB_REF_NAME,$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
