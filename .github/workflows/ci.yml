name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # 打 tag 时发布 proxyd 和带 caddy-l4 的 Caddy；caddy.Install 从 releases/latest 下载
  # caddy-l4-<os>-<arch>，并用同名 .sha256 文件校验
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/proxyd-linux-$arch ./cmd/proxyd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch xcaddy build --with github.com/mholt/caddy-l4 --output dist/caddy-l4-linux-$arch
          done
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
