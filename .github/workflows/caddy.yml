name: caddy

# 构建部署所用的 Caddy（官方标准模块 + 本仓库的 proxy_gateway 网关），发布到固定的 release tag `caddy`。
# caddy.Install 从 releases/download/caddy/caddy-gateway-<os>-<arch> 下载，并用同名 .sha256 文件校验。
# Caddy 及其依赖的版本由 go.mod 固定，升级时修改 go.mod 即可。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/caddy.yml
      - cmd/caddy/**
      - gateway/**
      - go.mod
      - go.sum

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./gateway/...
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/caddy-gateway-linux-$arch ./cmd/caddy
          done
      - name: Verify modules
        run: |
          set -euo pipefail
          mods=$(dist/caddy-gateway-linux-amd64 list-modules)
          for m in proxy_gateway admin.api.proxy_gateway; do
            grep -qx "$m" <<<"$mods" || { echo "missing $m"; exit 1; }
          done
          {
            echo "部署用 Caddy（官方标准模块 + proxy_gateway 网关），由 workflow 从 ${GITHUB_SHA::7} 构建。"
            echo
            echo '```'
            dist/caddy-gateway-linux-amd64 version
            echo '```'
          } > notes.md
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view caddy >/dev/null 2>&1; then
            gh release edit caddy --title "Caddy with proxy_gateway" --notes-file notes.md --latest=false
            gh release upload caddy dist/* --clobber
          else
            gh release create caddy dist/* --title "Caddy with proxy_gateway" --notes-file notes.md --latest=false
          fi
