name: proxy-gateway

# 构建网关程序 proxy-gateway（官方 Caddy 的标准模块 + 本仓库的 proxy_gateway 网关模块），发布到固定的 release tag `proxy-gateway`。
# proxyd deploy 从 releases/download/proxy-gateway/proxy-gateway-<os>-<arch> 下载，并用同名 .sha256 文件校验；
# 每次 deploy 都比较校验和，发布版本更新后自动替换。proxy-gateway.revision 记录构建所用的提交。
# Caddy 及其依赖的版本由 go.mod 固定，升级时修改 go.mod 即可。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxy-gateway.yml
      - cmd/proxy-gateway/**
      - gateway/**
      - go.mod
      - go.sum

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./gateway/...
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/proxy-gateway-linux-$arch ./cmd/proxy-gateway
          done
      - name: Verify modules
        run: |
          set -euo pipefail
          mods=$(dist/proxy-gateway-linux-amd64 list-modules)
          for m in proxy_gateway admin.api.proxy_gateway; do
            grep -qx "$m" <<<"$mods" || { echo "missing $m"; exit 1; }
          done
          {
            echo "网关程序 proxy-gateway（官方 Caddy 标准模块 + proxy_gateway 网关模块），由 workflow 从 ${GITHUB_SHA::7} 构建。"
            echo
            echo '```'
            echo "Caddy $(dist/proxy-gateway-linux-amd64 version)"
            echo '```'
          } > notes.md
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
          # proxyd version 据此判断已安装的网关是否为最新发布版本
          echo "$GITHUB_SHA $(git show -s --format=%cI HEAD)" > proxy-gateway.revision
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view proxy-gateway >/dev/null 2>&1; then
            gh release edit proxy-gateway --title "proxy-gateway" --notes-file notes.md --latest=false
            gh release upload proxy-gateway dist/* --clobber
          else
            gh release create proxy-gateway dist/* --title "proxy-gateway" --notes-file notes.md --latest=false
          fi
